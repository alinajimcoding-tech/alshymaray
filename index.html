<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تذكيرات حجي محمد</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 25px;
        }
        .card {
            background: #eef2f3;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #219653;
        }
        button.recording {
            background-color: #c0392b;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            background: #fff;
            border: 1px solid #e0e0e0;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
        }
        .delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            width: auto;
            margin: 0;
        }
        .status {
            text-align: center;
            font-weight: bold;
            color: #e67e22;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>مواعيد وتذكيرات حجي محمد</h1>

        <!-- قسم الإدخال الصوتي -->
        <div class="card">
            <h3>إضافة موعد بالصوت</h3>
            <p style="font-size: 14px; color: #666;">اضغط على الزر واحكي التذكير بوضوح:</p>
            <button id="recordBtn" onclick="toggleSpeechRecognition()">🎤 اضغط وابدأ بالحكي</button>
            <div id="status" class="status"></div>
        </div>

        <!-- قسم الإدخال اليدوي السريع -->
        <div class="card">
            <h3>إضافة موعد كتابةً</h3>
            <input type="text" id="eventText" placeholder="اكتب التذكير هنا (مثلاً: موعد الدواء الساعة 4)">
            <button onclick="addManualEvent()" style="background-color: #2980b9;">إضافة الحدث</button>
        </div>

        <!-- قائمة التذكيرات -->
        <h2>التذكيرات الحالية:</h2>
        <ul id="eventsList">
            <!-- ستعرض الأحداث هنا -->
        </ul>
    </div>

    <script>
        const eventsList = document.getElementById('eventsList');
        const statusDiv = document.getElementById('status');
        const recordBtn = document.getElementById('recordBtn');
        const eventInput = document.getElementById('eventText');

        // تحميل البيانات المحفوظة مسبقاً إذا توفرت
        document.addEventListener('DOMContentLoaded', loadEvents);

        function addEventToDOM(text) {
            const li = document.createElement('li');
            li.innerHTML = `
                <span>${text}</span>
                <button class="delete-btn" onclick="removeEvent(this)">حذف</button>
            `;
            eventsList.appendChild(li);
            saveEvents();
        }

        function addManualEvent() {
            const text = eventInput.value.trim();
            if (text) {
                addEventToDOM(text);
                eventInput.value = '';
            } else {
                alert('الرجاء كتابة تفاصيل التذكير');
            }
        }

        function removeEvent(button) {
            button.parentElement.remove();
            saveEvents();
        }

        function saveEvents() {
            const items = [];
            eventsList.querySelectorAll('li span').forEach(span => {
                items.push(span.textContent);
            });
            localStorage.setItem('hajiMohammadEvents', JSON.stringify(items));
        }

        function loadEvents() {
            const saved = localStorage.getItem('hajiMohammadEvents');
            if (saved) {
                JSON.parse(saved).forEach(text => {
                    addEventToDOM(text);
                });
            }
        }

        // دعم الإدخال الصوتي باستخدام المتصفح (Web Speech API)
        let recognition;
        function toggleSpeechRecognition() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('متصفحك لا يدعم الإدخال الصوتي، يرجى استخدام متصفح حديث مثل كروم.');
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'ar-IQ'; // لهجة عراقية / عربية
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = function() {
                recordBtn.textContent = '🔴 جاي أسمعك... احكي الآن';
                recordBtn.classList.add('recording');
                statusDiv.textContent = 'استماع...';
            };

            recognition.onresult = function(event) {
                const speechResult = event.results[0][0].transcript;
                addEventToDOM(speechResult);
                statusDiv.textContent = 'تمت إضافة التذكير بنجاح: "' + speechResult + '"';
            };

            recognition.onerror = function(event) {
                statusDiv.textContent = 'صار خطأ، حاول مرة ثانية.';
                resetRecordButton();
            };

            recognition.onend = function() {
                resetRecordButton();
            };

            recognition.start();
        }

        function resetRecordButton() {
            recordBtn.textContent = '🎤 اضغط وابدأ بالحكي';
            recordBtn.classList.remove('recording');
        }
    </script>
</body>
</html>
