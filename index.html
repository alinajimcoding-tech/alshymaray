<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تذكيرات حجي محمد</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 25px;
        }
        .card {
            background: #eef2f3;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
            color: #34495e;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #219653;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            background: #fff;
            border: 1px solid #e0e0e0;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
        }
        .event-info {
            display: flex;
            flex-direction: column;
        }
        .event-time {
            font-size: 14px;
            color: #e67e22;
            font-weight: bold;
            margin-top: 5px;
        }
        .delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            width: auto;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>مواعيد وتذكيرات حجي محمد</h1>

        <!-- قسم إضافة موعد منظم -->
        <div class="card">
            <h3>إضافة موعد أو حدث جديد</h3>
            
            <label for="eventText">اسم الموعد / الحدث:</label>
            <input type="text" id="eventText" placeholder="مثلاً: موعد الدواء، زيارة الدكتور...">

            <label for="eventDate">التاريخ:</label>
            <input type="date" id="eventDate">

            <label for="eventTime">الوقت:</label>
            <input type="time" id="eventTime">

            <button onclick="addStructuredEvent()">حفظ الموعد</button>
        </div>

        <!-- قائمة التذكيرات -->
        <h2>التذكيرات والنشاطات:</h2>
        <ul id="eventsList">
            <!-- ستعرض الأحداث هنا -->
        </ul>
    </div>

    <script>
        const eventsList = document.getElementById('eventsList');
        const eventInput = document.getElementById('eventText');
        const eventDateInput = document.getElementById('eventDate');
        const eventTimeInput = document.getElementById('eventTime');

        // ضبط التاريخ الافتراضي ليوم غد أو اليوم
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            eventDateInput.value = today;
            loadEvents();
            
            // طلب إذن التنبيهات من الجهاز
            if (window.Notification && Notification.permission !== "granted") {
                Notification.requestPermission();
            }

            // فحص المواعيد كل دقيقة لتنبيه الجهاز
            setInterval(checkAlarms, 60000);
        });

        function addStructuredEvent() {
            const text = eventInput.value.trim();
            const date = eventDateInput.value;
            const time = eventTimeInput.value;

            if (!text || !date || !time) {
                alert('الرجاء ملء جميع الحقول (اسم الموعد، التاريخ، والوقت)');
                return;
            }

            const eventObj = {
                id: Date.now(),
                text: text,
                date: date,
                time: time
            };

            saveEventToStorage(eventObj);
            addEventToDOM(eventObj);

            // تصفير الحقول
            eventInput.value = '';
            eventTimeInput.value = '';
        }

        function addEventToDOM(eventObj) {
            const li = document.createElement('li');
            li.setAttribute('data-id', eventObj.id);
            li.innerHTML = `
                <div class="event-info">
                    <span><strong>${eventObj.text}</strong></span>
                    <span class="event-time">📅 ${eventObj.date} ⏰ ${eventObj.time}</span>
                </div>
                <button class="delete-btn" onclick="removeEvent(${eventObj.id})">حذف</button>
            `;
            eventsList.appendChild(li);
        }

        function saveEventToStorage(eventObj) {
            let events = JSON.parse(localStorage.getItem('hajiMohammadStructuredEvents')) || [];
            events.push(eventObj);
            localStorage.setItem('hajiMohammadStructuredEvents', JSON.stringify(events));
        }

        function loadEvents() {
            eventsList.innerHTML = '';
            let events = JSON.parse(localStorage.getItem('hajiMohammadStructuredEvents')) || [];
            // ترتيب حسب التاريخ والوقت
            events.sort((a, b) => new Date(`${a.date}T${a.time}`) - new Date(`${b.date}T${b.time}`));
            events.forEach(eventObj => {
                addEventToDOM(eventObj);
            });
        }

        function removeEvent(id) {
            let events = JSON.parse(localStorage.getItem('hajiMohammadStructuredEvents')) || [];
            events = events.filter(e => e.id !== id);
            localStorage.setItem('hajiMohammadStructuredEvents', JSON.stringify(events));
            loadEvents();
        }

        // دالة فحص التنبيهات وإرسال إشعار للجهاز
        function checkAlarms() {
            let events = JSON.parse(localStorage.getItem('hajiMohammadStructuredEvents')) || [];
            const now = new Date();
            
            // تنسيق الوقت الحالي بالشكل YYYY-MM-DD و HH:MM
            const currentDate = now.toISOString().split('T')[0];
            const currentHours = String(now.getHours()).padStart(2, '0');
            const currentMinutes = String(now.getMinutes()).padStart(2, '0');
            const currentTime = `${currentHours}:${currentMinutes}`;

            events.forEach(event => {
                if (event.date === currentDate && event.time === currentTime) {
                    triggerNotification(event.text);
                }
            });
        }

        function triggerNotification(text) {
            if (window.Notification && Notification.permission === "granted") {
                new Notification("تنبيه لمحي محمد:", {
                    body: text,
                    icon: "https://cdn-icons-png.flaticon.com/512/3236/3236952.png"
                });
            } else {
                alert("تنبيه موعد: " + text);
            }
        }
    </script>
</body>
</html>
