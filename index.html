<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تذكيرات حجي محمد</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 20px;
        }
        .permission-banner {
            background: #f39c12;
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .card {
            background: #eef2f3;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
            color: #34495e;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #219653;
        }
        .voice-btn {
            background-color: #8e44ad;
        }
        .voice-btn.recording {
            background-color: #c0392b;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            background: #fff;
            border: 1px solid #e0e0e0;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .event-info {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            margin-left: 10px;
        }
        .event-time {
            font-size: 14px;
            color: #e67e22;
            font-weight: bold;
            margin-top: 5px;
        }
        audio {
            width: 100%;
            margin-top: 8px;
            height: 35px;
        }
        .delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            width: auto;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>تذكيرات حجي محمد</h1>

        <!-- زر لتفعيل نظام التنبيهات والصوت لدى المتصفح -->
        <div id="permissionBanner" class="permission-banner" onclick="enableAudioAndNotifications()">
            اضغط هنا لتفعيل التنبيهات الصوتية والجرس 🔔
        </div>

        <!-- قسم الإدخال بالصوت (تحويل لنص أو تسجيل بصمة) -->
        <div class="card">
            <h3>إضافة تذكير صوتي سريع</h3>
            <label>1. تحويل الحكي إلى كتابة مباشرة:</label>
            <button id="speechTextBtn" class="voice-btn" onclick="startSpeechToText()">🎤 اضغط واحكي لتكتب الموعد</button>

            <label style="margin-top: 15px;">2. أو تسجيل بصمة صوتية (صوتك):</label>
            <button id="recordAudioBtn" class="voice-btn" style="background-color: #2980b9;" onclick="toggleAudioRecording()">🎙️ ابدأ تسجيل بصمة صوتية</button>
            <div id="recordingStatus" style="font-size: 14px; color: #c0392b; margin-top: 5px; text-align: center;"></div>
        </div>

        <!-- قسم الإدخال اليدوي مع الوقت -->
        <div class="card">
            <h3>إضافة يدوية دقيقة</h3>
            <input type="text" id="eventText" placeholder="اسم الحدث أو الموعد...">
            <label>التاريخ والوقت:</label>
            <input type="date" id="eventDate">
            <input type="time" id="eventTime">
            <button onclick="addManualEvent()">حفظ الموعد مع التنبيه</button>
        </div>

        <h2>التذكيرات والنشاطات:</h2>
        <ul id="eventsList"></ul>
    </div>

    <!-- عنصر صوتي داخلي لتشغيل رنين التنبيه وقت الموعد -->
    <audio id="alarmSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        const eventsList = document.getElementById('eventsList');
        const eventInput = document.getElementById('eventText');
        const eventDateInput = document.getElementById('eventDate');
        const eventTimeInput = document.getElementById('eventTime');
        const alarmSound = document.getElementById('alarmSound');
        const permissionBanner = document.getElementById('permissionBanner');

        let mediaRecorder;
        let audioChunks = [];
        let recordedAudioBlob = null;

        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            eventDateInput.value = today;
            loadEvents();
            setInterval(checkAlarms, 10000); // يفحص كل 10 ثواني بدقة
        });

        function enableAudioAndNotifications() {
            alarmSound.play().then(() => {
                alarmSound.pause();
                alarmSound.currentTime = 0;
                permissionBanner.style.display = 'none';
                alert('تم تفعيل التنبيهات الصوتية بنجاح!');
            }).catch(e => {
                console.log(e);
            });

            if (window.Notification && Notification.permission !== "granted") {
                Notification.requestPermission();
            }
        }

        // 1. تحويل الكلام إلى نص (Speech-to-Text)
        function startSpeechToText() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('متصفحك لا يدعم التحويل الصوتي المباشر، استعمل الكروم.');
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-IQ';
            recognition.start();

            recognition.onresult = function(event) {
                const text = event.results[0][0].transcript;
                eventInput.value = text;
            };
            recognition.onerror = function() {
                alert('حدث خطأ في التقاط الصوت، حاول مرة أخرى.');
            };
        }

        // 2. تسجيل بصمة صوتية (Audio Recording)
        async function toggleAudioRecording() {
            const btn = document.getElementById('recordAudioBtn');
            const statusDiv = document.getElementById('recordingStatus');

            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        recordedAudioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                        statusDiv.textContent = '✅ تم تسجيل البصمة الصوتية بنجاح! الآن حدد التاريخ والوقت واضغط حفظ.';
                    };

                    mediaRecorder.start();
                    btn.textContent = '⏹️ إيقاف التسجيل';
                    btn.classList.add('recording');
                    statusDiv.textContent = 'جاي أسجل الصوت الآن...';
                } catch (err) {
                    alert('يرجى السماح للمتصفح بالوصول للميكروفون.');
                }
            } else {
                mediaRecorder.stop();
                btn.textContent = '🎙️ ابدأ تسجيل بصمة صوتية';
                btn.classList.remove('recording');
            }
        }

        // حفظ الحدث (سواء نصي أو بصمة صوتية)
        function addManualEvent() {
            const text = eventInput.value.trim();
            const date = eventDateInput.value;
            const time = eventTimeInput.value;

            if ((!text && !recordedAudioBlob) || !date || !time) {
                alert('الرجاء إدخال اسم الحدث (أو بصمة صوتية) مع تحديد التاريخ والوقت!');
                return;
            }

            if (recordedAudioBlob) {
                const reader = new FileReader();
                reader.readAsDataURL(recordedAudioBlob);
                reader.onloadend = function() {
                    const base64Audio = reader.result;
                    saveAndRenderEvent({
                        id: Date.now(),
                        text: text || 'بصمة صوتية مسجلة 🎙️',
                        date: date,
                        time: time,
                        audio: base64Audio
                    });
                    resetForm();
                }
            } else {
                saveAndRenderEvent({
                    id: Date.now(),
                    text: text,
                    date: date,
                    time: time,
                    audio: null
                });
                resetForm();
            }
        }

        function resetForm() {
            eventInput.value = '';
            recordedAudioBlob = null;
            document.getElementById('recordingStatus').textContent = '';
        }

        function saveAndRenderEvent(eventObj) {
            let events = JSON.parse(localStorage.getItem('hajiEventsAdvanced')) || [];
            events.push(eventObj);
            localStorage.setItem('hajiEventsAdvanced', JSON.stringify(events));
            loadEvents();
        }

        function loadEvents() {
            eventsList.innerHTML = '';
            let events = JSON.parse(localStorage.getItem('hajiEventsAdvanced')) || [];
            events.sort((a, b) => new Date(`${a.date}T${a.time}`) - new Date(`${b.date}T${b.time}`));
            
            events.forEach(eventObj => {
                const li = document.createElement('li');
                let audioHtml = eventObj.audio ? `<audio controls src="${eventObj.audio}"></audio>` : '';
                
                li.innerHTML = `
                    <div class="event-info">
                        <span><strong>${eventObj.text}</strong></span>
                        <span class="event-time">📅 ${eventObj.date} ⏰ ${eventObj.time}</span>
                        ${audioHtml}
                    </div>
                    <button class="delete-btn" onclick="removeEvent(${eventObj.id})">حذف</button>
                `;
                eventsList.appendChild(li);
            });
        }

        function removeEvent(id) {
            let events = JSON.parse(localStorage.getItem('hajiEventsAdvanced')) || [];
            events = events.filter(e => e.id !== id);
            localStorage.setItem('hajiEventsAdvanced', JSON.stringify(events));
            loadEvents();
        }

        // فحص الإنذارات والأوقات بدقة وتشغيل الجرس الصوتي
        function checkAlarms() {
            let events = JSON.parse(localStorage.getItem('hajiEventsAdvanced')) || [];
            const now = new Date();
            const currentDate = now.toISOString().split('T')[0];
            const currentHours = String(now.getHours()).padStart(2, '0');
            const currentMinutes = String(now.getMinutes()).padStart(2, '0');
            const currentTime = `${currentHours}:${currentMinutes}`;

            events.forEach(event => {
                if (event.date === currentDate && event.time === currentTime) {
                    // تشغيل جرس التنبيه بصوت عالي
                    alarmSound.play().catch(e => console.log(e));
                    alert("🚨 موعد مهم لحجي محمد: " + event.text);
                }
            });
        }
    </script>
</body>
</html>
