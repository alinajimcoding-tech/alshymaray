<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تذكيرات حجي محمد - النسخة الملكية</title>
    <style>
        :root {
            --card-bg: rgba(15, 15, 20, 0.85);
            --text-color: #f3f4f6;
            --input-bg: rgba(25, 25, 35, 0.9);
            --border-color: #d4af37; /* لون ذهبي ملكي */
            --primary-gold: #d4af37;
            --accent-gold: #aa820a;
        }

        [data-theme="light"] {
            --card-bg: rgba(240, 240, 245, 0.9);
            --text-color: #1a1a1a;
            --input-bg: rgba(255, 255, 255, 0.95);
            --border-color: #b8860b;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        body {
            /* وضع الصورة الملكية المرفقة كخلفية ثابتة مع طبقة تغشية لوداضة النص */
            background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.85)), 
                        url('image_7dfdf8.jpg') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border: 2px solid var(--primary-gold);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .top-bar button {
            width: auto;
            padding: 8px 15px;
            font-size: 14px;
            margin: 0;
            background: var(--primary-gold);
            color: #000;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 15px;
            color: var(--primary-gold);
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        h3 {
            color: var(--primary-gold);
        }

        .permission-banner {
            background: linear-gradient(135deg, #d4af37, #aa820a);
            color: #000;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.3);
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
            color: var(--primary-gold);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            background: var(--input-bg);
            color: var(--text-color);
        }

        button {
            background-color: var(--primary-gold);
            color: #000;
            border: none;
            padding: 12px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        button:hover {
            opacity: 0.85;
        }

        .voice-btn {
            background-color: #1e3a8a;
            color: #fff;
            border: 1px solid var(--primary-gold);
        }
        .voice-btn.recording {
            background-color: #991b1b;
            color: #fff;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .event-info {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            margin-left: 10px;
        }

        .event-time {
            font-size: 14px;
            color: var(--primary-gold);
            font-weight: bold;
            margin-top: 5px;
        }

        audio {
            width: 100%;
            margin-top: 8px;
            height: 35px;
        }

        .delete-btn {
            background: #b91c1c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            width: auto;
            margin: 0;
        }
    </style>
</head>
<body data-theme="dark">

    <div class="container">
        <!-- شريط علوي ملكي للتحكم -->
        <div class="top-bar">
            <button onclick="toggleTheme()" id="themeToggleBtn">☀️ الوضع النهاري</button>
            <button onclick="toggleBackgroundMusic()" id="musicToggleBtn">🎵 تشغيل/إيقاف الموسيقى</button>
        </div>

        <h1>تذكيرات حجي محمد</h1>

        <div id="permissionBanner" class="permission-banner" onclick="enableAudioAndNotifications()">
            اضغط هنا لتفعيل التنبيهات والصوت والموسيقى الملكية 🔔
        </div>

        <!-- تسجيل البصمة الصوتية -->
        <div class="card">
            <h3>تسجيل بصمة صوتية للموعد</h3>
            <button id="recordAudioBtn" class="voice-btn" onclick="toggleAudioRecording()">🎙️ ابدأ تسجيل بصمة صوتية</button>
            <div id="recordingStatus" style="font-size: 14px; color: var(--primary-gold); margin-top: 5px; text-align: center;"></div>
        </div>

        <!-- الإدخال اليدوي -->
        <div class="card">
            <h3>إضافة يدوية دقيقة</h3>
            <input type="text" id="eventText" placeholder="اسم الحدث أو الموعد...">
            <label>التاريخ والوقت:</label>
            <input type="date" id="eventDate">
            <input type="time" id="eventTime">
            <button onclick="addManualEvent()">حفظ الموعد مع التنبيه</button>
        </div>

        <h3 style="border-bottom: 1px solid var(--primary-gold); padding-bottom: 5px;">التذكيرات والنشاطات:</h3>
        <ul id="eventsList"></ul>
    </div>

    <!-- مصدر موسيقى بديل ومضمون الاشتغال (يعتمد على ملف نغم هادئ افتراضي) -->
    <audio id="bgMusic" src="https://actions.google.com/sounds/v1/ambiences/coffee_shop.ogg" loop preload="auto"></audio>
    <audio id="alarmSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        const eventsList = document.getElementById('eventsList');
        const eventInput = document.getElementById('eventText');
        const eventDateInput = document.getElementById('eventDate');
        const eventTimeInput = document.getElementById('eventTime');
        const alarmSound = document.getElementById('alarmSound');
        const bgMusic = document.getElementById('bgMusic');
        const permissionBanner = document.getElementById('permissionBanner');
        const musicToggleBtn = document.getElementById('musicToggleBtn');
        const themeToggleBtn = document.getElementById('themeToggleBtn');

        let mediaRecorder;
        let audioChunks = [];
        let recordedAudioBlob = null;
        let isMusicPlaying = false;

        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            eventDateInput.value = today;
            loadEvents();
            setInterval(checkAlarms, 10000);
        });

        function enableAudioAndNotifications() {
            bgMusic.play().then(() => {
                isMusicPlaying = true;
                musicToggleBtn.textContent = '🎵 إيقاف الموسيقى';
                permissionBanner.style.display = 'none';
            }).catch(e => {
                alert("يرجى النقر مرة أخرى لتفعيل الصوت.");
            });

            if (window.Notification && Notification.permission !== "granted") {
                Notification.requestPermission();
            }
        }

        function toggleBackgroundMusic() {
            if (isMusicPlaying) {
                bgMusic.pause();
                isMusicPlaying = false;
                musicToggleBtn.textContent = '🎵 تشغيل الموسيقى';
            } else {
                bgMusic.play().then(() => {
                    isMusicPlaying = true;
                    musicToggleBtn.textContent = '🎵 إيقاف الموسيقى';
                }).catch(e => {
                    alert("المتصفح يمنع تشغيل الصوت تلقائياً، اضغط على الشريط الأصفر بالأعلى أولاً.");
                });
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            if (html.getAttribute('data-theme') === 'dark') {
                html.setAttribute('data-theme', 'light');
                themeToggleBtn.textContent = '🌙 الوضع المظلم';
            } else {
                html.setAttribute('data-theme', 'dark');
                themeToggleBtn.textContent = '☀️ الوضع النهاري';
            }
        }

        async function toggleAudioRecording() {
            const btn = document.getElementById('recordAudioBtn');
            const statusDiv = document.getElementById('recordingStatus');

            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    if (isMusicPlaying) {
                        bgMusic.pause(); // إيقاف الموسيقى تلقائياً وقت التسجيل
                    }

                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        recordedAudioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                        statusDiv.textContent = '✅ تم تسجيل البصمة الصوتية بنجاح!';
                        
                        if (isMusicPlaying) {
                            bgMusic.play(); // رجوع الموسيقى تلقائياً بعد انتهاء التسجيل
                        }
                    };

                    mediaRecorder.start();
                    btn.textContent = '⏹️ إيقاف التسجيل والحفظ';
                    btn.classList.add('recording');
                    statusDiv.textContent = 'جاي أسجل الصوت الآن...';
                } catch (err) {
                    alert('يرجى السماح للمتصفح بالوصول للميكروفون.');
                    if (isMusicPlaying) bgMusic.play();
                }
            } else {
                mediaRecorder.stop();
                btn.textContent = '🎙️ ابدأ تسجيل بصمة صوتية';
                btn.classList.remove('recording');
            }
        }

        function addManualEvent() {
            const text = eventInput.value.trim();
            const date = eventDateInput.value;
            const time = eventTimeInput.value;

            if ((!text && !recordedAudioBlob) || !date || !time) {
                alert('الرجاء إدخال اسم الحدث أو بصمة صوتية، مع تحديد التاريخ والوقت!');
                return;
            }

            if (recordedAudioBlob) {
                const reader = new FileReader();
                reader.readAsDataURL(recordedAudioBlob);
                reader.onloadend = function() {
                    const base64Audio = reader.result;
                    saveAndRenderEvent({
                        id: Date.now(),
                        text: text || 'بصمة صوتية مسجلة 🎙️',
                        date: date,
                        time: time,
                        audio: base64Audio
                    });
                    resetForm();
                }
            } else {
                saveAndRenderEvent({
                    id: Date.now(),
                    text: text,
                    date: date,
                    time: time,
                    audio: null
                });
                resetForm();
            }
        }

        function resetForm() {
            eventInput.value = '';
            recordedAudioBlob = null;
            document.getElementById('recordingStatus').textContent = '';
        }

        function saveAndRenderEvent(eventObj) {
            let events = JSON.parse(localStorage.getItem('hajiRoyalEvents')) || [];
            events.push(eventObj);
            localStorage.setItem('hajiRoyalEvents', JSON.stringify(events));
            loadEvents();
        }

        function loadEvents() {
            eventsList.innerHTML = '';
            let events = JSON.parse(localStorage.getItem('hajiRoyalEvents')) || [];
            events.sort((a, b) => new Date(`${a.date}T${a.time}`) - new Date(`${b.date}T${b.time}`));
            
            events.forEach(eventObj => {
                const li = document.createElement('li');
                let audioHtml = eventObj.audio ? `<audio controls src="${eventObj.audio}"></audio>` : '';
                
                li.innerHTML = `
                    <div class="event-info">
                        <span><strong>${eventObj.text}</strong></span>
                        <span class="event-time">📅 ${eventObj.date} ⏰ ${eventObj.time}</span>
                        ${audioHtml}
                    </div>
                    <button class="delete-btn" onclick="removeEvent(${eventObj.id})">حذف</button>
                `;
                eventsList.appendChild(li);
            });
        }

        function removeEvent(id) {
            let events = JSON.parse(localStorage.getItem('hajiRoyalEvents')) || [];
            events = events.filter(e => e.id !== id);
            localStorage.setItem('hajiRoyalEvents', JSON.stringify(events));
            loadEvents();
        }

        function checkAlarms() {
            let events = JSON.parse(localStorage.getItem('hajiRoyalEvents')) || [];
            const now = new Date();
            const currentDate = now.toISOString().split('T')[0];
            const currentHours = String(now.getHours()).padStart(2, '0');
            const currentMinutes = String(now.getMinutes()).padStart(2, '0');
            const currentTime = `${currentHours}:${currentMinutes}`;

            events.forEach(event => {
                if (event.date === currentDate && event.time === currentTime) {
                    alarmSound.play().catch(e => console.log(e));
                    alert("🚨 موعد مهم لحجي محمد: " + event.text);
                }
            });
        }
    </script>
</body>
</html>
