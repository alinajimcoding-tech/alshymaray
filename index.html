<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تذكيرات حجي محمد</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-color: #333;
            --input-bg: #fff;
            --border-color: #ccc;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #111);
            --card-bg: rgba(30, 30, 30, 0.9);
            --text-color: #f4f7f6;
            --input-bg: #2a2a2a;
            --border-color: #444;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        body {
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            backdrop-filter: blur(8px);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .top-bar button {
            width: auto;
            padding: 8px 15px;
            font-size: 14px;
            margin: 0;
        }

        h1 {
            text-align: center;
            font-size: 26px;
            margin-bottom: 15px;
        }

        .permission-banner {
            background: #f39c12;
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .card {
            background: rgba(0, 0, 0, 0.03);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            background: var(--input-bg);
            color: var(--text-color);
        }

        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
        }

        .voice-btn {
            background-color: #2980b9;
        }
        .voice-btn.recording {
            background-color: #c0392b;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .event-info {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            margin-left: 10px;
        }

        .event-time {
            font-size: 14px;
            color: #e67e22;
            font-weight: bold;
            margin-top: 5px;
        }

        audio {
            width: 100%;
            margin-top: 8px;
            height: 35px;
        }

        .delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            width: auto;
            margin: 0;
        }
    </style>
</head>
<body data-theme="light">

    <div class="container">
        <!-- شريط علوي للتحكم بالوضع المظلم والموسيقى -->
        <div class="top-bar">
            <button onclick="toggleTheme()" id="themeToggleBtn">🌙 الوضع المظلم</button>
            <button onclick="toggleBackgroundMusic()" id="musicToggleBtn" style="background-color: #8e44ad;">🎵 إيقاف الموسيقى</button>
        </div>

        <h1>تذكيرات حجي محمد</h1>

        <div id="permissionBanner" class="permission-banner" onclick="enableAudioAndNotifications()">
            اضغط هنا لتفعيل التنبيهات الصوتية والموسيقى 🔔
        </div>

        <!-- قسم تسجيل البصمة الصوتية -->
        <div class="card">
            <h3>تسجيل بصمة صوتية للموعد</h3>
            <button id="recordAudioBtn" class="voice-btn" onclick="toggleAudioRecording()">🎙️ ابدأ تسجيل بصمة صوتية</button>
            <div id="recordingStatus" style="font-size: 14px; color: #c0392b; margin-top: 5px; text-align: center;"></div>
        </div>

        <!-- الإدخال اليدوي -->
        <div class="card">
            <h3>إضافة يدوية دقيقة</h3>
            <input type="text" id="eventText" placeholder="اسم الحدث أو الموعد (اختياري مع البصمة)">
            <label>التاريخ والوقت:</label>
            <input type="date" id="eventDate">
            <input type="time" id="eventTime">
            <button onclick="addManualEvent()">حفظ الموعد مع التنبيه</button>
        </div>

        <h2>التذكيرات والنشاطات:</h2>
        <ul id="eventsList"></ul>
    </div>

    <!-- موسيقى الانتظار الهادئة (مجانية وخفيفة) -->
    <audio id="bgMusic" src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf756.mp3?filename=lofi-study-112191.mp3" loop preload="auto"></audio>
    <!-- صوت التنبيه للموعد -->
    <audio id="alarmSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        const eventsList = document.getElementById('eventsList');
        const eventInput = document.getElementById('eventText');
        const eventDateInput = document.getElementById('eventDate');
        const eventTimeInput = document.getElementById('eventTime');
        const alarmSound = document.getElementById('alarmSound');
        const bgMusic = document.getElementById('bgMusic');
        const permissionBanner = document.getElementById('permissionBanner');
        const musicToggleBtn = document.getElementById('musicToggleBtn');
        const themeToggleBtn = document.getElementById('themeToggleBtn');

        let mediaRecorder;
        let audioChunks = [];
        let recordedAudioBlob = null;
        let isMusicPlaying = false;

        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            eventDateInput.value = today;
            loadEvents();
            setInterval(checkAlarms, 10000);
        });

        // تفعيل الصوتيات والموسيقى أول مرة استجابة لضغط المستخدم
        function enableAudioAndNotifications() {
            bgMusic.play().then(() => {
                isMusicPlaying = true;
                musicToggleBtn.textContent = '🎵 إيقاف الموسيقى';
                permissionBanner.style.display = 'none';
            }).catch(e => console.log(e));

            if (window.Notification && Notification.permission !== "granted") {
                Notification.requestPermission();
            }
        }

        // تحكم يدوي بالموسيقى
        function toggleBackgroundMusic() {
            if (isMusicPlaying) {
                bgMusic.pause();
                isMusicPlaying = false;
                musicToggleBtn.textContent = '🎵 تشغيل الموسيقى';
            } else {
                bgMusic.play();
                isMusicPlaying = true;
                musicToggleBtn.textContent = '🎵 إيقاف الموسيقى';
            }
        }

        // تبديل الوضع المظلم والنهاري
        function toggleTheme() {
            const html = document.documentElement;
            if (html.getAttribute('data-theme') === 'dark') {
                html.setAttribute('data-theme', 'light');
                themeToggleBtn.textContent = '🌙 الوضع المظلم';
            } else {
                html.setAttribute('data-theme', 'dark');
                themeToggleBtn.textContent = '☀️ الوضع النهاري';
            }
        }

        // تسجيل البصمة الصوتية (مع إيقاف الموسيقى تلقائياً أثناء التسجيل وإرجاعها بعده)
        async function toggleAudioRecording() {
            const btn = document.getElementById('recordAudioBtn');
            const statusDiv = document.getElementById('recordingStatus');

            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    // إيقاف موسيقى الانتظار مؤقتاً أثناء التسجيل لضمان نقاء الصوت
                    if (isMusicPlaying) {
                        bgMusic.pause();
                    }

                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        recordedAudioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                        statusDiv.textContent = '✅ تم تسجيل البصمة الصوتية بنجاح! حدد الوقت واضغط حفظ.';
                        
                        // إعادة تشغيل الموسيقى إذا كانت مفعلة أساساً
                        if (isMusicPlaying) {
                            bgMusic.play();
                        }
                    };

                    mediaRecorder.start();
                    btn.textContent = '⏹️ إيقاف التسجيل والحفظ';
                    btn.classList.add('recording');
                    statusDiv.textContent = 'جاي أسجل الصوت الآن... (تم إيقاف الموسيقى مؤقتاً)';
                } catch (err) {
                    alert('يرجى السماح للمتصفح بالوصول للميكروفون.');
                    if (isMusicPlaying) bgMusic.play();
                }
            } else {
                mediaRecorder.stop();
                btn.textContent = '🎙️ ابدأ تسجيل بصمة صوتية';
                btn.classList.remove('recording');
            }
        }

        // حفظ الموعد
        function addManualEvent() {
            const text = eventInput.value.trim();
            const date = eventDateInput.value;
            const time = eventTimeInput.value;

            if ((!text && !recordedAudioBlob) || !date || !time) {
                alert('الرجاء إدخال اسم الحدث أو تسجيل بصمة صوتية، مع تحديد التاريخ والوقت!');
                return;
            }

            if (recordedAudioBlob) {
                const reader = new FileReader();
                reader.readAsDataURL(recordedAudioBlob);
                reader.onloadend = function() {
                    const base64Audio = reader.result;
                    saveAndRenderEvent({
                        id: Date.now(),
                        text: text || 'بصمة صوتية مسجلة 🎙️',
                        date: date,
                        time: time,
                        audio: base64Audio
                    });
                    resetForm();
                }
            } else {
                saveAndRenderEvent({
                    id: Date.now(),
                    text: text,
                    date: date,
                    time: time,
                    audio: null
                });
                resetForm();
            }
        }

        function resetForm() {
            eventInput.value = '';
            recordedAudioBlob = null;
            document.getElementById('recordingStatus').textContent = '';
        }

        function saveAndRenderEvent(eventObj) {
            let events = JSON.parse(localStorage.getItem('hajiEventsThemeMusic')) || [];
            events.push(eventObj);
            localStorage.setItem('hajiEventsThemeMusic', JSON.stringify(events));
            loadEvents();
        }

        function loadEvents() {
            eventsList.innerHTML = '';
            let events = JSON.parse(localStorage.getItem('hajiEventsThemeMusic')) || [];
            events.sort((a, b) => new Date(`${a.date}T${a.time}`) - new Date(`${b.date}T${b.time}`));
            
            events.forEach(eventObj => {
                const li = document.createElement('li');
                let audioHtml = eventObj.audio ? `<audio controls src="${eventObj.audio}"></audio>` : '';
                
                li.innerHTML = `
                    <div class="event-info">
                        <span><strong>${eventObj.text}</strong></span>
                        <span class="event-time">📅 ${eventObj.date} ⏰ ${eventObj.time}</span>
                        ${audioHtml}
                    </div>
                    <button class="delete-btn" onclick="removeEvent(${eventObj.id})">حذف</button>
                `;
                eventsList.appendChild(li);
            });
        }

        function removeEvent(id) {
            let events = JSON.parse(localStorage.getItem('hajiEventsThemeMusic')) || [];
            events = events.filter(e => e.id !== id);
            localStorage.setItem('hajiEventsThemeMusic', JSON.stringify(events));
            loadEvents();
        }

        function checkAlarms() {
            let events = JSON.parse(localStorage.getItem('hajiEventsThemeMusic')) || [];
            const now = new Date();
            const currentDate = now.toISOString().split('T')[0];
            const currentHours = String(now.getHours()).padStart(2, '0');
            const currentMinutes = String(now.getMinutes()).padStart(2, '0');
            const currentTime = `${currentHours}:${currentMinutes}`;

            events.forEach(event => {
                if (event.date === currentDate && event.time === currentTime) {
                    alarmSound.play().catch(e => console.log(e));
                    alert("🚨 موعد مهم لحجي محمد: " + event.text);
                }
            });
        }
    </script>
</body>
</html>
